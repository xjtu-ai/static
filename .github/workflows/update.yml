name: Send submodule updates to parent repo

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xjtu-ai/xjtu-ai.github.io
          token: ${{ secrets.UPDATE }}
          fetch-depth: 0

      - name: Pull & update submodules recursively
        run: |
          git submodule update --init --recursive
          git submodule update --recursive --remote

      # master is protected by a ruleset (pull request + required checks
      # build / markdownlint), so never push to it directly. Open a PR instead
      # and let the required checks gate the submodule bump.
      - name: Open pull request for the submodule bump
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.UPDATE }}
          base: master
          branch: chore/update-static-submodule
          add-paths: docs/static
          commit-message: "chore: update static submodule"
          title: "chore: update static submodule"
          body: |
            Automated submodule bump from `${{ github.repository }}`@`${{ github.sha }}`.

            `docs/static` was updated to the latest `xjtu-ai/static` master.
            Required checks (`build`, `markdownlint`) gate this change, so
            `master` stays protected.

      - name: Enable auto-merge once checks pass
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.UPDATE }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          gh pr merge --auto --squash --delete-branch "$PR_URL" \
            || echo "::warning::could not enable auto-merge (already enabled, or token lacks pull_requests: write) — leaving the PR open for manual merge"
